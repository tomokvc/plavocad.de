<style>
/* Schriften lokal (keine Verbindung zu Google) - Dateien liegen in fonts/ */
@font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/barlow-condensed-500.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/barlow-condensed-600.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/barlow-condensed-700.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/ibm-plex-sans-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/ibm-plex-sans-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/ibm-plex-sans-600.woff2') format('woff2'); }

<style>
:root { --blue: #2458e8; --blue-deep: #163aa6; --blue-ink: #0e2a7a; --blue-wash: #e8eefd; --paper: #f7f7f3; --ink: #141a22; --muted: #5b6470; --rule: #d5d8d0;
  --display: "Barlow Condensed", "Avenir Next Condensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace; color-scheme: light; }
* { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
.wrap { width: 100%; max-width: 1400px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
header { border-bottom: 1px solid var(--rule); background: rgba(247,247,243,.95); flex: 0 0 auto; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
.logo { display: flex; text-decoration: none; }
.logo svg { height: 36px; width: auto; display: block; }
.back { font-weight: 600; font-size: .9rem; color: var(--ink); text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 2px; }
.back:hover { color: var(--blue); }
main { flex: 1 1 auto; display: flex; flex-direction: column; padding-block: 22px 18px; min-height: 0; }
main .wrap { flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 24px; }
.tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
h1 { font-family: var(--display); font-stretch: condensed; font-weight: 700; text-transform: uppercase; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1; margin: 6px 0 0; }
.facts { display: flex; border: 1.5px solid var(--ink); background: #fff; }
.facts div { padding: 6px 14px 8px; }
.facts div + div { border-left: 1px solid var(--ink); }
.facts small { display: block; font-family: var(--mono); font-size: .6rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.facts b { font-family: var(--display); font-stretch: condensed; font-weight: 600; font-size: 1.1rem; }
.v3d { flex: 1 1 auto; min-height: 420px; box-shadow: 10px 10px 0 var(--blue); margin-right: 10px; margin-bottom: 10px; }
.v3d-stage { min-height: 300px; }
footer { flex: 0 0 auto; border-top: 1px solid var(--rule); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); font-size: .82rem; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; }
footer a { color: var(--ink); text-decoration: none; } footer a:hover { color: var(--blue); }
/* 3D-Viewer im PlavoCAD-Design: Planblatt mit Kopfleiste, Millimeterraster, Fussleiste wie Plankopf */
.v3d { background: #fff; border: 1.5px solid var(--ink); color: var(--ink); display: flex; flex-direction: column; min-width: 0; }
.v3d-bar, .v3d-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 10px; background: #fff; }
.v3d-bar { border-bottom: 1.5px solid var(--ink); }
.v3d-foot { border-top: 1.5px solid var(--ink); padding: 10px 14px; }
.v3d-views { display: flex; border: 1.5px solid var(--ink); max-width: 100%; overflow-x: auto; }
.v3d-views button, .v3d-zoom button { font: 500 .72rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: #fff; border: 0; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.v3d-views button + button { border-left: 1.5px solid var(--ink); }
.v3d-views button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.v3d-views button:hover:not([aria-pressed="true"]), .v3d-zoom button:hover { background: var(--blue-wash); }
.v3d-zoom { display: flex; border: 1.5px solid var(--ink); }
.v3d-zoom button { font-size: 1rem; padding: 4px 13px; line-height: 1.4; }
.v3d-zoom button + button { border-left: 1.5px solid var(--ink); }
.v3d button:focus-visible, .v3d input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.v3d-stage { position: relative; flex: 1 1 auto; min-height: 360px; overflow: hidden; background-color: var(--paper);
  background-image: linear-gradient(rgba(36,88,232,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(36,88,232,.08) 1px, transparent 1px),
                    linear-gradient(rgba(36,88,232,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(36,88,232,.035) 1px, transparent 1px);
  background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px; }
.v3d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.v3d-canvas:active { cursor: grabbing; }
.v3d-poster { position: absolute; inset: 0; display: grid; place-items: center; padding: 6%; }
.v3d-poster svg { width: 100%; height: auto; max-height: 100%; }
.v3d-poster .iso polygon { stroke: var(--blue); stroke-width: .6; }
.v3d-poster .iso .floor { fill: rgba(36,88,232,.04); } .v3d-poster .iso .deck { fill: none; }
.v3d-poster .iso .ws, .v3d-poster .iso .we, .v3d-poster .iso .ds, .v3d-poster .iso .de, .v3d-poster .iso .fs, .v3d-poster .iso .fe { fill: #fff; }
.v3d-poster .iso .tt { fill: var(--blue); } .v3d-poster .iso .tn { fill: #8aa5f0; } .v3d-poster .iso .dt { fill: #d9e2fb; } .v3d-poster .iso .ft { fill: var(--blue-wash); }
.v3d-layer { position: absolute; inset: 0; pointer-events: none; }
.v3d-lbl { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; line-height: 1.1; will-change: transform; }
.v3d-lbl b { display: block; font-family: var(--display); font-stretch: condensed; font-weight: 600; font-size: .86rem; text-transform: uppercase; letter-spacing: .02em; color: var(--ink);
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff; }
.v3d-lbl i { font-style: normal; font-family: var(--mono); font-size: .64rem; color: var(--blue-deep); text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.v3d-tip { position: absolute; left: 10px; bottom: 10px; font-family: var(--mono); font-size: .66rem; letter-spacing: .04em; color: var(--muted);
  background: rgba(255,255,255,.88); border: 1px solid var(--rule); padding: 4px 8px; pointer-events: none; transition: opacity .3s, color .2s, border-color .2s; }
.v3d-used .v3d-tip { opacity: 0; }
.v3d-hint .v3d-tip { opacity: 1; color: var(--blue-deep); border-color: var(--blue); }
.v3d-nogl .v3d-tip, .v3d-nogl .v3d-bar, .v3d-nogl .v3d-foot { display: none; }
.v3d-foot label { display: flex; align-items: center; gap: 8px; font-size: .86rem; cursor: pointer; }
.v3d-foot small { font-family: var(--mono); font-size: .64rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.v3d-foot input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--blue); }
.v3d-foot input[type=range] { width: 120px; accent-color: var(--blue); }
.v3d-foot output { font-family: var(--mono); font-size: .76rem; min-width: 4.2em; font-variant-numeric: tabular-nums; }
.v3d-checks { display: flex; gap: 18px; }
@media (max-width: 560px) {
  .v3d-zoom { display: none; }
  .v3d-lbl i { display: none; } .v3d-lbl b { font-size: .7rem; }
  .v3d-views button { padding: 8px 9px; font-size: .66rem; }
  .v3d-foot input[type=range] { width: 90px; }
}
@media (prefers-reduced-motion: reduce) { .v3d-tip { transition: none; } }

@media (max-width: 640px) { .facts { width: 100%; } .facts div { flex: 1 1 0; padding-inline: 10px; } .v3d { min-height: 520px; margin-right: 6px; box-shadow: 6px 6px 0 var(--blue); } }
</style>
</head>

ke-width="13" stroke-linejoin="miter" stroke-miterlimit="6"/><path d="M6.5 6.5 H23 A12.5 12.5 0 0 1 35.5 19 V51 A12.5 12.5 0 0 1 23 63.5 H6.5 Z" transform="translate(246.96 0) scale(0.72)" fill="none" stroke="#2458e8" stroke-width="13" stroke-linejoin="miter" stroke-miterlimit="6"/></g></svg>
  </a>
  <a class="back" href="index.html#beispiel">← Zum Beispielprojekt</a>
</div></header>
<main><div class="wrap">
  <div class="head">
    <div><span class="tag">Beispielprojekt · 3D-Modell</span><h1>Mehrfamilienhaus EG in 3D</h1></div>
    <div class="facts" aria-label="Projektdaten">
      <div><small>Wohnungen</small><b>3</b></div>
      <div><small>Wohnfläche</small><b>186,75 m²</b></div>
      <div><small>Grundlage</small><b>Plan 1:50</b></div>
    </div>
  </div>
  <div class="v3d" id="v3d-full">
  <div class="v3d-bar">
    <div class="v3d-views" role="group" aria-label="Ansicht wählen">
      <button type="button" data-view="iso" aria-pressed="true">Übersicht</button><button type="button" data-view="top" aria-pressed="false">Draufsicht</button><button type="button" data-view="terr" aria-pressed="false">Eingang</button><button type="button" data-view="wohn" aria-pressed="false">Wohnen</button>
    </div>
    <div class="v3d-zoom"><button type="button" data-v3d="zout" aria-label="Verkleinern">−</button><button type="button" data-v3d="zin" aria-label="Vergrößern">+</button></div>
  </div>
  <div class="v3d-stage" data-v3d="stage" aria-label="3D-Modell, mit Maus oder Finger drehen">
    <div class="v3d-poster"></div>
    <div class="v3d-layer" data-v3d="layer"></div>
    <span class="v3d-tip">Ziehen = drehen · Rechtsklick/zwei Finger = verschieben · Scrollen = zoomen</span>
  </div>
  <div class="v3d-foot">
    <label for="v3d-full-cut"><small>Schnitthöhe</small><input type="range" id="v3d-full-cut" data-v3d="cut" min="0.4" max="2.6" step="0.05" value="2.6"><output data-v3d="cut-out" for="v3d-full-cut">2,60 m</output></label>
    <div class="v3d-checks">
      <label for="v3d-full-furn"><input type="checkbox" id="v3d-full-furn" data-v3d="furn" checked> Möbel</label>
      <label for="v3d-full-lab"><input type="checkbox" id="v3d-full-lab" data-v3d="labels" checked> Räume</label>
    </div>
  </div>
</div>
</div></main>
